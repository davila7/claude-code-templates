# Cloudflare Worker Configuration
# Newsletter — Biweekly Community Components Email (Resend transactional batch)

name = "aitmpl-newsletter"
main = "index.js"
compatibility_date = "2024-01-01"

# Cron — fires every 10 minutes on Sundays 16:00–17:50 UTC, but index.js only
# sends on EVEN ISO weeks (biweekly; Cloudflare cron can't express "every 2
# weeks"). Each firing processes one chunk of pending subscribers (Workers
# free plan allows 50 subrequests/invocation) and later firings pick up the
# rest; when nothing is pending a firing is a cheap no-op, which also makes
# cron double-fires harmless. The account's 5-cron-trigger limit had this
# slot taken by claude-docs-monitor, decommissioned 2026-07.
[triggers]
crons = ["*/10 16-17 * * SUN"]

[vars]
# Public deploy-time values (not secrets)
DASHBOARD_URL = "https://www.aitmpl.com"
RESEND_FROM_EMAIL = "Daniel Avila <daniel.avila@aitmpl.com>"
# Public base URL for per-recipient unsubscribe links (this worker's own URL)
UNSUBSCRIBE_BASE_URL = "https://aitmpl-newsletter.dan-avila7.workers.dev"

# Secrets (set via: wrangler secret put <KEY>)
# Required:
# - RESEND_API_KEY: Resend API key (transactional /emails/batch)
# - NEON_DATABASE_URL: Neon Postgres connection string (email_subscribers table)
# - NEWSLETTER_REPLY_TO: reply-to address for the newsletter
# - TRIGGER_SECRET: Secret for manual /trigger and /preview endpoints
#
# Optional (error tracking):
# - SENTRY_DSN: DSN from the "aitmpl-workers" Sentry project. Also configure a
#   Cron Monitor in Sentry with slug "newsletter-weekly".
