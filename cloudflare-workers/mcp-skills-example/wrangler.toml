# Example MCP server that serves skills (Skills over MCP). Remote, read-only, no sign-in.
# No CI deploys this worker: `npx wrangler deploy` from this folder (see README.md).
name = "aitmpl-mcp-skills-example"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "skills-example.aitmpl.com", custom_domain = true }]
workers_dev = false

# The skill files are bundled as text, so the served bytes are exactly the files in skills/.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[observability]
enabled = true

[vars]
ALLOWED_HOSTNAMES = "skills-example.aitmpl.com"
