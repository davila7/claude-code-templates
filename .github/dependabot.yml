version: 2
updates:
  # Minor and patch bumps arrive grouped (one PR per ecosystem and week);
  # majors stay one PR each because they usually need code changes.
  # Security updates are separate and not limited by these groups.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/cli-tool"
      - "/cli-tool/analytics-ui"
      - "/dashboard"
      - "/cloudflare-workers/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
