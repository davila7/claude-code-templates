name: Update component content

# Content-only refresh of the generated catalog. Runs when a component
# changes on main and regenerates every generated artifact WITHOUT querying
# Supabase (--skip-downloads keeps the download counts already in the
# catalog), so it finishes in seconds. The download counts themselves are
# refreshed by update-json-data.yml (daily cron), which pulls the whole
# component_downloads table and takes minutes.

on:
  push:
    branches: [main]
    paths:
      - 'cli-tool/components/**'
      - 'cli-tool/templates/**'
      - 'scripts/generate_components_json.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-catalog
  cancel-in-progress: false

jobs:
  update-content:
    runs-on: ubuntu-latest
    # The daily cron's own commits touch only generated files, which are not
    # in `paths`, so this job never re-triggers itself.
    if: github.actor != 'github-actions[bot]'

    env:
      DATA_PATHS: >-
        docs/components.json
        dashboard/public/components.json
        dashboard/public/counts.json
        dashboard/public/search-index.json
        dashboard/public/components
        dashboard/public/component-content

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cli-tool/package-lock.json'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv

      - name: Install Node.js dependencies
        run: |
          cd cli-tool
          npm ci --ignore-scripts

      - name: Regenerate the catalog, keeping the current download counts
        run: python scripts/generate_components_json.py --skip-downloads

      - name: Stage generated data and check for changes
        id: check_changes
        run: |
          git add -A -- $DATA_PATHS
          if git diff --cached --quiet -- $DATA_PATHS; then
            echo "No changes in the generated data."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat -- $DATA_PATHS
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: Update component content

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          git pull --rebase origin main
          git push
