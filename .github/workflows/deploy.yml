name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
        working-directory: dashboard
      - name: Build
        run: npm run build
        working-directory: dashboard
        env:
          PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_live_Y2xlcmsuYWl0bXBsLmNvbSQ"
          PUBLIC_GITHUB_CLIENT_ID: "Ov23li3KjfA4cuLi5c0k"
          PUBLIC_COMPONENTS_JSON_URL: "/components.json"
      - name: Build Agent Plugins zips
        # Exploded bundle trees ship as committed static assets in
        # dashboard/public/agent-plugins/ (already inside dist after the
        # build). Zips are deploy-time-only artifacts — never committed.
        run: |
          npm ci --ignore-scripts --prefix cli-tool
          node scripts/build_agent_plugins.js --out /tmp/agent-plugins-build --zips
          mkdir -p dashboard/dist/agent-plugins/zips
          cp /tmp/agent-plugins-build/zips/*.zip dashboard/dist/agent-plugins/zips/
      - name: Deploy www + app.aitmpl.com
        run: npx wrangler pages deploy dist --project-name=aitmpl-dashboard --commit-dirty=true
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
