name: Update JSON Data

on:
  schedule:
    # Every day at 03:00 UTC. The deploy at the end is an atomic Cloudflare
    # Pages swap, so the hour doesn't risk downtime; it's just a quiet one.
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub UI

permissions:
  contents: write
  # to start deploy.yml once the refreshed data is pushed
  actions: write

jobs:
  update-json:
    runs-on: ubuntu-latest

    # Every file the generators below write. Both the change check and the
    # commit use this one list so they can't drift apart: anything missing here
    # is regenerated on the runner and then thrown away, which is what used to
    # leave the dashboard artifacts stale on main.
    env:
      DATA_PATHS: >-
        docs/components.json
        docs/trending-data.json
        docs/claude-jobs.json
        dashboard/public/components.json
        dashboard/public/counts.json
        dashboard/public/search-index.json
        dashboard/public/trending-data.json
        dashboard/public/claude-jobs.json
        dashboard/public/components
        dashboard/public/component-content

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cli-tool/package-lock.json'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv pyyaml

      - name: Install Node.js dependencies
        run: |
          cd cli-tool
          npm ci --ignore-scripts

      - name: Create .env file with secrets
        # Secrets go through env: so the shell reads them as data. Interpolating
        # ${{ secrets.X }} straight into the script would let a value containing
        # a quote or newline break out of the echo.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .env
          printf 'SUPABASE_API_KEY=%s\n' "$SUPABASE_API_KEY" >> .env

      - name: Generate components.json
        run: python scripts/generate_components_json.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

      - name: Generate trending-data.json
        run: python scripts/generate_trending_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}

      - name: Generate claude-jobs.json
        run: python scripts/generate_claude_jobs.py

      - name: Copy data to dashboard
        run: |
          cp docs/claude-jobs.json dashboard/public/claude-jobs.json
          cp docs/trending-data.json dashboard/public/trending-data.json

      - name: Stage generated data and check for changes
        id: check_changes
        run: |
          git add -A -- $DATA_PATHS
          if git diff --cached --quiet -- $DATA_PATHS; then
            echo "No changes in the generated data."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --stat -- $DATA_PATHS
          fi

      # Generation takes ~8 minutes, and main often moves in that window
      # (merges, and update-component-content.yml committing the same catalog
      # files), so a plain push gets rejected and a rebase conflicts on the
      # single-line JSON blobs. Instead, rebuild the commit on top of the
      # current main: keep this run's fresh counts and trending data, and
      # regenerate the catalog content from main with --skip-downloads (which
      # reads the counts back from docs/components.json; seconds, no Supabase).
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          fresh="$RUNNER_TEMP/fresh-data"
          mkdir -p "$fresh"
          cp docs/components.json docs/trending-data.json docs/claude-jobs.json "$fresh/"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$fresh/components.json" docs/components.json
            python scripts/generate_components_json.py --skip-downloads
            cp "$fresh/trending-data.json" docs/trending-data.json
            cp "$fresh/trending-data.json" dashboard/public/trending-data.json
            cp "$fresh/claude-jobs.json" docs/claude-jobs.json
            cp "$fresh/claude-jobs.json" dashboard/public/claude-jobs.json

            git add -A -- $DATA_PATHS
            if git diff --cached --quiet -- $DATA_PATHS; then
              echo "main already has this data; nothing to push."
              exit 0
            fi
            git commit -m "chore: Update components and trending data

          🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved), retrying on the new main ($attempt/5)"
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the refreshed data after 5 attempts"
          exit 1

      # The push above uses GITHUB_TOKEN, which GitHub never lets trigger
      # another workflow, so deploy.yml's `push: dashboard/**` does not fire
      # for it and the new counts would wait for the next unrelated deploy.
      # Dispatch the deploy explicitly so they reach aitmpl.com today.
      - name: Deploy the refreshed data
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
